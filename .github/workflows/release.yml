name: release

# After changes land on main, materialize git tags + GitHub Releases for any
# plugin/marketplace version that does not yet have a matching tag. Tags are
# immutable: existing ones are never moved, so this is safe to re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or current version tag to reconcile
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Owner-specific policy is kept outside CI. This does not approve publication.
      - name: Run structural checks and generic privacy scan before releases
        run: |
          node scripts/validate.mjs
          node scripts/catalog.mjs --check
          node scripts/plugin-readme.mjs --check
          node scripts/public-readiness.mjs --tracked

      - name: Create missing tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          requested="${REQUESTED_TAG:-}"
          if [ -n "$requested" ]; then
            if ! echo "$requested" | grep -Eq '^(v|[a-z0-9-]+-v)[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid release tag: $requested" >&2
              exit 1
            fi
            current=$(node scripts/version.mjs tags --json --all \
              | node -e 'process.stdin.resume();let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).some(t=>t.tag===process.argv[1])?"yes":"no"))' "$requested")
            if ! git rev-parse -q --verify "refs/tags/$requested" >/dev/null \
              && [ "$current" != "yes" ]; then
              echo "Tag is neither existing nor a current release version: $requested" >&2
              exit 1
            fi
            wanted=$(node -e 'process.stdout.write(JSON.stringify([{tag:process.argv[1]}]))' "$requested")
          else
            wanted=$(node scripts/version.mjs tags --json --all)
          fi
          count=$(echo "$wanted" | node -e 'process.stdin.resume();let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).length))')
          if [ "$count" = "0" ]; then
            echo "No release versions found."
            exit 0
          fi

          echo "$wanted" | node -e 'process.stdin.resume();let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for(const t of JSON.parse(d))console.log(t.tag)})' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              # Idempotency guard: never move an existing tag or re-create a release.
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "tag $tag already exists, skipping"
              else
                git tag -a "$tag" -m "$tag"
                git push origin "refs/tags/$tag"
              fi
              notes=$(node scripts/version.mjs notes --tag "$tag")
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "release $tag already exists, skipping"
              else
                printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
                echo "created release $tag"
              fi
            done
